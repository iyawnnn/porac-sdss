name: Scheduled Cron Jobs

# Calls the existing api/src/cron/cron.controller.ts endpoints on a
# schedule — none of them have any other trigger today (urgency/weather
# recompute also happen inline on dashboard/ticket loads, so this is a
# safety net for them; the three cleanup jobs and the ticket-escalation
# check have no other trigger at all). One daily schedule for everything
# rather than several schedules with per-job conditionals — every job here
# is cheap and idempotent, so there's nothing to gain from splitting them.
#
# Required repository configuration (Settings > Secrets and variables > Actions):
#   secrets.CRON_SECRET       - same value as the deployed API's CRON_SECRET env var
#   vars.PORAC_API_BASE_URL   - deployed API origin, e.g. https://api.example.com (no trailing slash)
#
# Until the API is actually deployed neither of those exists, so this workflow
# is EXPECTED to skip (green, exit 0) on every scheduled run before production
# deployment. It only starts calling endpoints once both are configured.

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Manila (UTC+8) — low-traffic hours for this
    # municipal system's actual users.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  trigger-cron-endpoints:
    runs-on: ubuntu-latest
    env:
      PORAC_API_BASE_URL: ${{ vars.PORAC_API_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check deployment configuration
        id: check
        run: |
          if [ -z "$PORAC_API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping scheduled cron calls: deployment configuration is not set yet."
            echo "vars.PORAC_API_BASE_URL set: $([ -n "$PORAC_API_BASE_URL" ] && echo yes || echo no)"
            echo "secrets.CRON_SECRET set: $([ -n "$CRON_SECRET" ] && echo yes || echo no)"
            echo "Configure both under Settings > Secrets and variables > Actions once the API is deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger cron endpoints
        if: steps.check.outputs.configured == 'true'
        run: |
          set -eu
          for path in \
            recompute-urgency \
            recompute-weather \
            cleanup-password-reset-tokens \
            cleanup-notifications \
            cleanup-rate-limit-events \
            check-ticket-escalations
          do
            echo "POST /cron/$path"
            curl -sf -X POST "$PORAC_API_BASE_URL/cron/$path" \
              -H "Authorization: Bearer $CRON_SECRET"
          done
